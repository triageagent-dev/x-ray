{{- /* Self-signed CA and certificate for the mesh's mutual TLS: no cert-manager.
Every pod mounts the same certificate, named for the mesh (xray-mesh) because
peers are dialed by pod IP, and accepts only a peer whose certificate this CA
signed. It must survive upgrades: a fresh CA on every helm upgrade would split
old and new pods during each rollout. The live Secret is looked up and kept when
present; delete it and upgrade to rotate. */}}
{{- if include "xray.mesh" . }}
{{- $name := printf "%s-mesh-tls" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Values.namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}
    app.kubernetes.io/component: mesh
type: kubernetes.io/tls
data:
{{- if and $existing $existing.data (hasKey $existing.data "ca.crt") }}
  ca.crt: {{ index $existing.data "ca.crt" }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
{{- else }}
{{- $ca := genCA "xray-mesh-ca" 3650 }}
{{- $cert := genSignedCert "xray-mesh" nil (list "xray-mesh") 3650 $ca }}
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
{{- end }}
