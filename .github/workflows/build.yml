name: Build and Test

on:
  push:
    branches: [ main, develop, feature/*, feat/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # Docs-only changes build nothing. The jobs below are skipped, not absent, so
  # the required checks still report and a docs PR can merge.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - id: diff
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        code=true
        if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
          if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qvE '^(docs/|[^/]+\.md$|LICENSE$|NOTICE$)'; then
            code=true
          else
            code=false
          fi
        fi
        echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v7
      with:
        go-version-file: "go.mod"
        cache: true
        cache-dependency-path: go.sum

    - name: Cache Go build cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/go-build
        key: ${{ runner.os }}-gobuild-${{ hashFiles('**/*.go') }}
        restore-keys: |
          ${{ runner.os }}-gobuild-

    - name: Go lint
      run: make lint

  test:
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v7
      with:
        go-version-file: "go.mod"
        cache: true
        cache-dependency-path: go.sum

    - name: Cache Go build cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/go-build
        key: ${{ runner.os }}-gobuild-${{ hashFiles('**/*.go') }}
        restore-keys: |
          ${{ runner.os }}-gobuild-

    # Both builds: part of the tree sits behind cgo / !cgo tags, so one setting
    # proves only its half.
    - name: Run tests (cgo, with the parser)
      run: make test

    - name: Run tests (static, no parser)
      run: CGO_ENABLED=0 go test ./...

    - name: Build static binary
      run: CGO_ENABLED=0 go build ./cmd/xray/...

  ui:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: ui/package-lock.json

    - name: Type-check, lint and test the web UI
      run: make ui-test

    # The export must build, embed and be served by the binary.
    - uses: actions/setup-go@v7
      with:
        go-version-file: "go.mod"

    - name: Build the binary with the UI embedded
      run: make build

    - name: The embedded UI is served
      run: |
        set -euo pipefail
        ./bin/xray --dev --http-address=127.0.0.1:18080 --mcp-address= --metrics-address= >/tmp/xray.log 2>&1 &
        for _ in $(seq 1 30); do curl -sf http://127.0.0.1:18080/healthz >/dev/null && break; sleep 1; done
        curl -sf http://127.0.0.1:18080/ | grep -q '<title>'
        curl -sf http://127.0.0.1:18080/login | grep -q '<title>'
        curl -sf http://127.0.0.1:18080/v1/version >/dev/null

  adapters:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v7
      with:
        go-version-file: "go.mod"

    # The ADK adapter is its own module, so ./... above does not reach it.
    - name: Test the ADK adapter
      working-directory: adapters/adk
      run: |
        go vet ./...
        go test ./...

  charts:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: azure/setup-helm@v5
      with:
        version: v3.16.2

    - run: helm lint charts/xray

    # The memory chart must render, and must start without secrets nobody made.
    - name: Render the memory chart
      run: |
        set -euo pipefail
        helm template xray charts/xray -n xray > /tmp/default.yaml
        if grep -q secretKeyRef /tmp/default.yaml; then
          echo 'the default render references a Secret nobody created' >&2
          exit 1
        fi
        helm template xray charts/xray -n xray --set dev=true | grep -q -- '- --dev'
        helm template xray charts/xray -n xray --set github.secretName=github-oauth | grep -q GITHUB_CLIENT_ID
