# adapters/adk is a nested module that replaces the root module with ../.., which Dependabot
# cannot resolve on its own; it follows the root module's versions.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    # mcp-go 1.x is a migration of its own, and the ADK adapter pins it too.
    ignore:
      - dependency-name: github.com/mark3labs/mcp-go
        update-types: [version-update:semver-major]
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /ui
    schedule: {interval: weekly}
    # eslint 10 breaks eslint-plugin-react, which eslint-config-next bundles; wait for it.
    ignore:
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # React 18 to 19 is a migration of its own, not a routine bump.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
      # The UI builds on Node 22; its types stay on the 22 line.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # tailwind-merge 3 targets Tailwind v4; the UI is on Tailwind 3.
      - dependency-name: tailwind-merge
        update-types: [version-update:semver-major]
      # Tailwind 4 is a migration of its own; the UI is on Tailwind 3 (see tailwind-merge).
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      # jsdom 31 fails the UI tests.
      - dependency-name: jsdom
        update-types: [version-update:semver-major]
      # TypeScript 7 drops options tsconfig.json still sets (target ES5).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # vitest 5 needs a newer @types/node than the Node 22 line.
      - dependency-name: vitest
        update-types: [version-update:semver-major]
    groups:
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
